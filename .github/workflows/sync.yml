name: Sync from Club Repo

on:
  schedule:
    - cron: "0 9 * * 0"   # every Sunday at 9:00 UTC = 4:00 AM EST
  workflow_dispatch:

permissions:
  contents: write   # allow pushing into your repo

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Configure Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

      - name: Clone club repo
        run: |
          git clone https://github.com/codingUnited/challenge-EddieRichardson.git source
          cd source
    
          # Make sure we have every branch from the club repo
          git fetch --all
      
          # List only real branch names from the remote
          for branch in $(git ls-remote --heads origin | awk '{print $2}' | sed 's#refs/heads/##'); do
            if [ "$branch" != "workflow" ]; then
              git push --force \
                https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Eddie-Richardson/challenge-EddieRichardson.git \
                refs/remotes/origin/$branch:refs/heads/$branch
            fi
          done


      
          # Push all tags too
          git push --tags --force https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Eddie-Richardson/challenge-EddieRichardson.git
