name: Sync from Club Repo

on:
  push:
    branches:
      - '**'   # trigger on all branches in the club repo
  schedule:
    - cron: "0 9 * * 0"   # every Sunday at 9:00 UTC = 4:00 AM EST
  workflow_dispatch:

permissions:
  contents: write   # allow pushing into your repo

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Configure Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

      - name: Clone club repo
        run: |
          git clone https://github.com/codingUnited/challenge-EddieRichardson.git source
          cd source

          # Fetch all branches and prune deleted ones
          git fetch --all --prune

          # Push each branch from the club repo into your personal repo, skipping workflow
          for branch in $(git ls-remote --heads origin | awk '{print $2}' | sed 's#refs/heads/##'); do
            if [ "$branch" != "workflow" ]; then
              git push --force \
                https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Eddie-Richardson/challenge-EddieRichardson.git \
                refs/remotes/origin/$branch:refs/heads/$branch
            fi
          done

          # Push all tags too (with prune to drop deleted tags)
          git push --tags --force --prune \
            https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Eddie-Richardson/challenge-EddieRichardson.git
